name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    # The shared photo wall (README, "Photo wall") reads these repository
    # variables, named with or without the VITE_ prefix. They are variables, not
    # secrets: the keys are public by design. Unset, the wall stays local.
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY || vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # A note on the run's summary page saying whether the shared wall is on.
      - name: Check the photo wall settings
        run: |
          missing=""
          [ -n "$VITE_SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || missing="$missing SUPABASE_ANON_KEY"
          [ -n "$VITE_TURNSTILE_SITE_KEY" ] || missing="$missing TURNSTILE_SITE_KEY"
          if [ -z "$missing" ]; then
            echo "::notice title=Photo wall::Shared wall on, using $VITE_SUPABASE_URL"
          else
            echo "::warning title=Photo wall::Repository variables not found:$missing. Without SUPABASE_URL and SUPABASE_ANON_KEY, photos visitors add stay in their own browsers; without TURNSTILE_SITE_KEY, sending fails while Supabase's captcha is on."
          fi
      - name: Type-check and build
        run: npm run build
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish website
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
